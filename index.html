<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Levonyak Consulting</title>
  <meta name="description" content="Levonyak Consulting LLC. Worldwide software consulting, driven by agentic engineering.">
  <link rel="canonical" href="https://levonyak.com/">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0b0d" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233F9FC2'/%3E%3Ctext x='16' y='23' font-family='Arial,sans-serif' font-size='20' font-weight='700' text-anchor='middle' fill='%23fff'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <main>
    <section class="hero">
      <div class="brand">
        <picture>
          <source srcset="levonyak-reversed.svg" media="(prefers-color-scheme: dark)">
          <img class="logo" src="levonyak-primary.svg" alt="Levonyak" width="540" height="125">
        </picture>
        <h1 class="tagline">Agentic Engineering</h1>
      </div>

      <span class="separator" aria-hidden="true"></span>

      <a class="cta" href="mailto:hello@levonyak.com">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="2"></rect>
          <path d="m3 7 9 6 9-6"></path>
        </svg>
        Let&rsquo;s talk

      <div class="contact">
        <div class="contact-row">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2"></rect>
              <path d="m3 7 9 6 9-6"></path>
            </svg>
          </span>
          <div>
            <div class="contact-label">Email</div>
            <div class="contact-value">
              <a href="mailto:hello@levonyak.com">hello@levonyak.com</a>
            </div>
          </div>
        </div>

        <div class="contact-row">
          <span class="contact-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
          </span>
          <div>
            <div class="contact-label">Address</div>
            <address class="contact-value">
              Levonyak Consulting LLC<br>
              7901 4th St N #6439<br>
              St. Petersburg, FL 33702<br>
              United States
            </address>
          </div>
        </div>
      </div>
